# Pane and Window bindings
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# refresh tmux
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded"

# Vim bindings for pane movements
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Setting mouse on
set -g mouse on

# Setting of status bar
set -g status-style "bg=#000000 fg=white"
set -g status-right ""
set -g status-left ""
set -g window-status-format "  #W  "
set -g window-status-current-format "  #[bold]#W#[normal] #[fg=default] "
set -g status-justify absolute-centre
set -g window-status-current-style "bg=#f5426c fg=colour255"

# Setting escape time for neovim inside tmux
set -s escape-time 10

# prefix remapping to Ctrl + ;
unbind C-b
set -g prefix C-a
